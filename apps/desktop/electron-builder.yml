appId: io.github.masseater.cdmm
productName: Claude Max Desktop Manager
extraMetadata:
  name: cdmm
directories:
  output: release
files:
  - dist/**
  - assets/**
  - package.json
  - "!**/node_modules/**"
  - node_modules/koffi/**
  - node_modules/@koromix/**
asarUnpack:
  - "**/node_modules/koffi/**"
  - "**/node_modules/@koromix/**"
win:
  target:
    - target: nsis
      arch: x64
  icon: assets/icon.png
nsis:
  oneClick: true
  perMachine: false
