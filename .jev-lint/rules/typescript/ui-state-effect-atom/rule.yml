id: ui-state-effect-atom
languages: [TypeScript, Tsx]
kind: noul
rule: { kind: program }
subject: file
state: bare
ask: This code holds client-side UI state with something other than effect-atom, such as useState, useReducer, React context used as a store, zustand, jotai or redux.
criteria:
  "true": Client-side UI state is held by something other than effect-atom.
  "false":
    what: Client-side UI state is held only by effect-atom, or the file holds none, as in a component that calls no state hook, creates no store and keeps no module-level mutable value.
    not_for: Server data read or written through TanStack Query (useQuery, useSuspenseQuery, useMutation and their results), which is server state; creating a TanStack Query QueryClient or configuring the router. None of these hold UI state.
severity: error
threshold: 0.67
