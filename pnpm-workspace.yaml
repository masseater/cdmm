packages:
  - apps/*
  - libs/*
  - infra/*
  - tools/*
  - .claude

catalogMode: prefer

catalog:
  "@effect/platform-node": 4.0.0
  "@eslint-react/eslint-plugin": 5.23.3
  "@shadcn/lint": 0.2.0
  "@tanstack/eslint-plugin-query": 5.104.0
  "@types/node": 24.19.0
  eslint-plugin-react-hooks: 7.1.1
  syncpack: 15.3.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  jev-lint: 0.7.0
  eslint-plugin-no-comments: 1.2.1
  eslint-plugin-baseline-js: 0.7.2
  "@html-eslint/eslint-plugin-react": 0.66.1
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
catalogs:
  stack:
    "@effect/atom-react": 4.0.0
    "@effect/tsgo": 0.48.0
    "@tanstack/react-query": 5.104.0
    effect: 4.0.0
    fallow: 3.31.0
    radix-ui: 1.6.7
    renovate: 44.126.1
    steiger: 0.7.0
    tailwindcss: 4.3.3
    textlint: 15.8.0
    typescript: 7.0.2
    vite-plus: 1.0.0
overrides:
  effect: "catalog:stack"
  "@effect/platform-node-shared": 4.0.0
  "@effect/vitest": 4.0.0
  vite@*: "catalog:"
  eslint-plugin-react-hooks>zod-validation-error: ^5.0.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@ast-grep/cli": true
  esbuild: true
  protobufjs: false
  core-js-pure: false
  dtrace-provider: false
  re2: true
  electron: true
  electron-winstaller: false
packageExtensions:
  "@feature-sliced/steiger-plugin@0.8.0":
    dependencies:
      "@steiger/toolkit": 0.2.3
